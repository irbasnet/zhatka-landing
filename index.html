<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zhatka — QR Landing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Work Sans', sans-serif; color: #111111; background: #ffffff; }

  /* ---------- Splash screen ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 100;
    background: #ff0000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
    opacity: 1;
    transition: opacity 0.5s ease;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }
  #splash.removed { display: none; }
  #splash .mark {
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    transform: translateY(-9vh);
  }
  #splash .bolt {
    height: 150px; width: auto;
    animation: bolt-pulse 1.6s ease-in-out infinite;
  }
  #splash .wordmark {
    font-family: 'Archivo Black', sans-serif;
    font-size: 60px; letter-spacing: 1px; color: #ffffff;
  }
  #splash .tagline {
    position: absolute; bottom: 26px; left: 0; right: 0;
    text-align: center; font-size: 12px; font-weight: 600;
    letter-spacing: 3px; color: #ffffff;
  }
  @keyframes bolt-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  /* ---------- Page ---------- */
  #page {
    min-height: 100vh; width: 100%;
    display: flex; flex-direction: column; align-items: center;
  }
  .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; flex: 1; }

  .hero {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 48px 32px 40px; gap: 18px;
  }
  .hero img { width: 100%; max-width: 340px; height: auto; }
  .hero p { font-size: 17px; line-height: 1.5; opacity: 0.75; max-width: 320px; }

  .links { display: flex; flex-direction: column; gap: 16px; padding: 36px 24px 130px; }
  .link-card {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 92px; padding: 0 26px; border-radius: 14px;
    text-decoration: none; color: #ffffff;
  }
  .link-card.primary { background: #ff0000; }
  .link-card.dark { background: #111111; }
  .link-title { display: flex; flex-direction: column; gap: 2px; }
  .link-title .label { font-family: 'Archivo Black', sans-serif; font-size: 24px; letter-spacing: 0.5px; }
  .link-title .sub { font-size: 14px; }
  .link-card.primary .sub { opacity: 0.85; }
  .link-card.dark .sub { color: #ff5b5b; }
  .chevron { font-family: 'Archivo Black', sans-serif; font-size: 28px; line-height: 1; }
  .link-card.primary .chevron { color: #ffffff; }
  .link-card.dark .chevron { color: #ff0000; }

  /* ---------- Footer ---------- */
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; width: 100%;
    background: #111111; display: flex; justify-content: center; z-index: 20;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.25);
  }
  .footer-inner {
    width: 100%; max-width: 480px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 18px 24px 22px;
  }
  .socials { display: flex; gap: 14px; }
  .social-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.1); color: #ffffff;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
  }
  .copyright { font-size: 12px; letter-spacing: 0.5px; color: #ffffff; opacity: 0.5; }
</style>
</head>
<body>

<!--
  EDIT THE LINKS BELOW — this is the only place you need to touch
  for URLs and social handles.
-->
<script>
  var LINKS = {
    shop: 'https://zhatka.com.au/',
    recipes: 'https://zhatka.com.au/pages/recipes',   // placeholder — page not created yet
    feedback: 'https://zhatka.com.au/pages/contact',  // guessed contact page — confirm real URL
    instagram: 'https://instagram.com/',              // placeholder — add real handle
    tiktok: 'https://tiktok.com/',                     // placeholder — add real handle
    facebook: 'https://facebook.com/',                 // placeholder — add real handle
  };
</script>

<div id="splash" data-screen-label="Zhatka splash">
  <div class="mark">
    <img class="bolt" src="assets/zhatka-bolt-white.svg" alt="">
    <span class="wordmark">ZHATKA</span>
  </div>
  <p class="tagline">DEEPLY FLAVOURFUL · WILDLY HIMALAYAN</p>
</div>

<div id="page" data-screen-label="Zhatka QR landing">
  <div class="container">

    <div class="hero">
      <img src="assets/zhatka-logo.svg" alt="Zhatka">
      <p>Deeply flavourful. Wildly Himalayan. Small-batch hot sauce with a proper kick — thanks for scanning, here's where to go next.</p>
    </div>

    <div class="links">
      <a class="link-card primary" href="#" target="_blank" rel="noopener" id="link-shop">
        <span class="link-title">
          <span class="label">SHOP THE SAUCE</span>
          <span class="sub">zhatka.com.au</span>
        </span>
        <span class="chevron">&rsaquo;</span>
      </a>

      <a class="link-card dark" href="#" id="link-recipes">
        <span class="link-title">
          <span class="label">RECIPES</span>
          <span class="sub">Get saucy in the kitchen</span>
        </span>
        <span class="chevron">&rsaquo;</span>
      </a>

      <a class="link-card dark" href="#" target="_blank" rel="noopener" id="link-feedback">
        <span class="link-title">
          <span class="label">FEEDBACK</span>
          <span class="sub">Tell us how it went</span>
        </span>
        <span class="chevron">&rsaquo;</span>
      </a>
    </div>

  </div>
</div>

<footer>
  <div class="footer-inner">
    <div class="socials">
      <a class="social-btn" href="#" target="_blank" rel="noopener" aria-label="Instagram" id="link-instagram">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"></rect><circle cx="12" cy="12" r="4.2"></circle><circle cx="17.4" cy="6.6" r="1.2" fill="currentColor" stroke="none"></circle></svg>
      </a>
      <a class="social-btn" href="#" target="_blank" rel="noopener" aria-label="TikTok" id="link-tiktok">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 2h-3.2v14.2c0 1.6-1.3 2.9-2.9 2.9a2.9 2.9 0 0 1-2.9-2.9 2.9 2.9 0 0 1 2.9-2.9c.3 0 .6 0 .9.1V10c-.3 0-.6-.1-.9-.1-3.4 0-6.1 2.7-6.1 6.1S7.1 22.1 10.5 22.1s6.1-2.7 6.1-6.1V8.4c1.2 1 2.7 1.6 4.4 1.6V6.8c-2.4 0-4.4-2-4.4-4.5V2z"></path></svg>
      </a>
      <a class="social-btn" href="#" target="_blank" rel="noopener" aria-label="Facebook" id="link-facebook">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 22v-8.4h2.8l.4-3.3h-3.2V8.1c0-1 .3-1.6 1.7-1.6h1.7V3.5c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.4H8.4v3.3h2.8V22h3.3z"></path></svg>
      </a>
    </div>
    <p class="copyright" id="copyright"></p>
  </div>
</footer>

<script>
  document.getElementById('link-shop').href = LINKS.shop;
  document.getElementById('link-recipes').href = LINKS.recipes;
  document.getElementById('link-feedback').href = LINKS.feedback;
  document.getElementById('link-instagram').href = LINKS.instagram;
  document.getElementById('link-tiktok').href = LINKS.tiktok;
  document.getElementById('link-facebook').href = LINKS.facebook;
  document.getElementById('copyright').textContent = '© ' + new Date().getFullYear() + ' Zhatka';

  var splash = document.getElementById('splash');
  var dismissed = false;
  function dismissSplash() {
    if (dismissed) return;
    dismissed = true;
    splash.classList.add('hidden');
    setTimeout(function () { splash.classList.add('removed'); }, 500);
  }
  splash.addEventListener('click', dismissSplash);
  setTimeout(dismissSplash, 1500);
</script>

</body>
</html>
