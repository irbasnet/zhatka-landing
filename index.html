<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zhatka — QR Landing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<div id="splash" data-screen-label="Zhatka splash">
  <div class="mark">
    <img class="bolt" src="assets/zhatka-bolt-white.svg" alt="">
    <span class="wordmark">ZHATKA</span>
  </div>
  <p class="tagline">DEEPLY FLAVOURFUL · WILDLY HIMALAYAN</p>
</div>

<div id="page" data-screen-label="Zhatka QR landing">
  <div class="container">

    <div class="hero">
      <img src="assets/zhatka-logo.svg" alt="Zhatka">
      <p>Deeply flavourful. Wildly Himalayan.</p>
    </div>

    <div class="links">
      <a class="link-card primary" href="#" target="_blank" rel="noopener" id="link-shop">
        <span class="link-title">
          <span class="label">SHOP THE SAUCE</span>
          <span class="sub">zhatka.com.au</span>
        </span>
        <span class="chevron">&rsaquo;</span>
      </a>

      <a class="link-card maroon" href="#" id="link-recipes">
        <span class="link-title">
          <span class="label">RECIPES</span>
          <span class="sub">Get saucy in the kitchen</span>
        </span>
        <span class="chevron">&rsaquo;</span>
      </a>

      <a class="link-card charcoal" href="#" target="_blank" rel="noopener" id="link-feedback">
        <span class="link-title">
          <span class="label">FEEDBACK</span>
          <span class="sub">Tell us how it went</span>
        </span>
        <span class="chevron">&rsaquo;</span>
      </a>
    </div>

  </div>
</div>

<footer>
  <div class="footer-inner">
    <div class="socials">
      <a class="social-btn" href="#" target="_blank" rel="noopener" aria-label="Instagram" id="link-instagram">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"></rect><circle cx="12" cy="12" r="4.2"></circle><circle cx="17.4" cy="6.6" r="1.2" fill="currentColor" stroke="none"></circle></svg>
      </a>
      <a class="social-btn" href="#" target="_blank" rel="noopener" aria-label="TikTok" id="link-tiktok">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 2h-3.2v14.2c0 1.6-1.3 2.9-2.9 2.9a2.9 2.9 0 0 1-2.9-2.9 2.9 2.9 0 0 1 2.9-2.9c.3 0 .6 0 .9.1V10c-.3 0-.6-.1-.9-.1-3.4 0-6.1 2.7-6.1 6.1S7.1 22.1 10.5 22.1s6.1-2.7 6.1-6.1V8.4c1.2 1 2.7 1.6 4.4 1.6V6.8c-2.4 0-4.4-2-4.4-4.5V2z"></path></svg>
      </a>
      <a class="social-btn" href="#" target="_blank" rel="noopener" aria-label="Facebook" id="link-facebook">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 22v-8.4h2.8l.4-3.3h-3.2V8.1c0-1 .3-1.6 1.7-1.6h1.7V3.5c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.4H8.4v3.3h2.8V22h3.3z"></path></svg>
      </a>
    </div>
    <p class="meta">
      <span id="copyright"></span><span class="dot">·</span><span id="version"></span>
    </p>
  </div>
</footer>

<script type="module" src="/src/main.js"></script>

</body>
</html>
